<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตัวสร้างตัวละคร D&D 5e</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7;--surface:#fffdf8;--surface2:#f0e9da;--ink:#2b2418;--ink2:#6a5f4b;--line:#ddd2bc;
  --accent:#9a2b1f;--accent-ink:#fff;--accent-soft:#f6dcd6;--ok:#2f6b3a;--ok-soft:#dcecd9;--warn:#8a5a00;--warn-soft:#f8e9c4;
  --radius:12px;--shadow:0 1px 2px rgba(60,40,10,.08),0 4px 14px rgba(60,40,10,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17140f;--surface:#211d16;--surface2:#2a251c;--ink:#f1e9d8;--ink2:#b3a78f;--line:#3d3526;
  --accent:#e0715f;--accent-ink:#1b0f0c;--accent-soft:#3a1f1a;--ok:#8fd19a;--ok-soft:#1f3322;--warn:#e9bd5a;--warn-soft:#3a2f12;--shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.6}
button,select,input{font:inherit;color:inherit}
#app{max-width:920px;margin:0 auto;padding:0 14px 90px}
header.top{padding:18px 2px 8px}
header.top h1{margin:0;font-size:1.45rem;line-height:1.3;letter-spacing:.2px}
header.top p{margin:2px 0 0;color:var(--ink2);font-size:.92rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 12px;scrollbar-width:thin;position:sticky;top:0;background:var(--bg);z-index:5}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.done .dot{background:var(--ok)} .chip.warn .dot{background:var(--warn)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on .dot{background:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 18px;margin:0 0 14px}
.card h2{margin:0 0 4px;font-size:1.2rem}
.card h3{margin:16px 0 6px;font-size:1rem}
.lead{color:var(--ink2);margin:0 0 12px;font-size:.95rem}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer;display:block;width:100%}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt b{display:block;font-size:.98rem}.opt small{display:block;color:var(--ink2);font-size:.82rem;line-height:1.4}
.tag{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:99px;background:var(--surface2);color:var(--ink2);margin-left:4px;vertical-align:1px}
.tag.easy{background:var(--ok-soft);color:var(--ok)} .tag.hard{background:var(--warn-soft);color:var(--warn)}
.info{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:.92rem}
.info ul{margin:4px 0 0;padding-left:20px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.9rem}
.good{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
nav.bottom .in{max-width:920px;margin:0 auto;display:flex;justify-content:space-between;gap:8px;align-items:center}
nav.bottom .hint{font-size:.82rem;color:var(--ink2);flex:1;text-align:center}
input[type=text],select{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;min-height:38px;max-width:100%}
input[type=text]{width:100%;max-width:420px}
label.f{display:block;font-size:.9rem;color:var(--ink2);margin:10px 0 3px}
.ab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ab{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.ab .h{display:flex;justify-content:space-between;align-items:baseline}.ab .h b{font-size:1.05rem}.ab .h span{font-size:.78rem;color:var(--ink2)}
.ab .v{font-size:1.5rem;font-weight:700;line-height:1.2}.ab .m{color:var(--ink2);font-size:.82rem}
.ab select{width:100%;margin-top:4px}
.ab.rec{border-color:var(--accent)}
.pm{display:flex;gap:6px;align-items:center;margin-top:4px}.pm button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;font-size:1.1rem}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.sk{border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center}
.sk.sel{border-color:var(--accent);background:var(--accent-soft)} .sk.fix{background:var(--surface2);cursor:default}
.sk[disabled]{opacity:.5;cursor:not-allowed}
.sk small{color:var(--ink2);font-size:.75rem}
.eqopt{display:flex;flex-direction:column;gap:6px}
.eq{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.eq .t{font-weight:500;margin-bottom:6px}
.radio{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;margin-bottom:5px;background:var(--surface);text-align:left;width:100%}
.radio.sel{border-color:var(--accent);background:var(--accent-soft)}
.radio[disabled]{opacity:.45;cursor:not-allowed}
.radio .o{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink2);flex:0 0 auto;margin-top:5px}
.radio.sel .o{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
/* ---------- result ---------- */
.sheet h2{font-size:1.1rem;margin:0}
.sec{margin:14px 0 4px;font-size:.78rem;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:3px}
.box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;background:var(--surface);position:relative}
.box .l{font-size:.74rem;color:var(--ink2);line-height:1.3}
.box .w{font-size:1.2rem;font-weight:700;line-height:1.3;word-break:break-word}
.box .why{font-size:.75rem;color:var(--ink2);margin-top:2px;line-height:1.35}
.box.chk{cursor:pointer}.box.done{background:var(--ok-soft);border-color:var(--ok)}
.box.done::after{content:'✓';position:absolute;right:8px;top:4px;color:var(--ok);font-weight:700}
.g2{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g6{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
.abbox{text-align:center}.abbox .w{font-size:1.9rem}.abbox .small{font-size:.9rem;color:var(--ink2)}
.abbox .nm{font-size:.82rem;font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--surface2);font-weight:500;font-size:.8rem}
.skl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 10px}
.sr{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding:3px 2px;font-size:.92rem}
.sr.p{font-weight:700;background:var(--accent-soft);border-radius:6px;padding:3px 6px}
.sr .c{font-variant-numeric:tabular-nums}
.feat{font-size:.9rem;margin:2px 0 6px}.feat ul{margin:2px 0;padding-left:18px}
.miss{border:1.5px dashed var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.92rem}
.miss ul{margin:4px 0 0;padding-left:20px}.miss a{color:inherit;cursor:pointer;text-decoration:underline}
.toggle{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--ink2)}
.pre{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:10px;font-size:.85rem;max-height:300px;overflow:auto}
.hide-why .why{display:none}
@media (max-width:520px){header.top h1{font-size:1.25rem}.card{padding:14px 12px}.btn{padding:8px 12px}}
</style></head><body><div id="app"></div>
<script>
// ===== DATA (D&D 5e 2014 PHB, level 1) =====
const AB = ['STR','DEX','CON','INT','WIS','CHA'];
const AB_TH = {STR:'พละกำลัง',DEX:'ความคล่องแคล่ว',CON:'ความทนทาน',INT:'สติปัญญา',WIS:'ปัญญา',CHA:'เสน่ห์'};
const AB_HINT = {STR:'ออกแรง ยก ผลัก ตีระยะประชิด',DEX:'ความไว การทรงตัว ยิงธนู หลบหลีก',CON:'ความอึด พลังชีวิต',INT:'ความจำ ตรรกะ เวทของ Wizard',WIS:'การรับรู้ สัญชาตญาณ เวทของ Cleric/Druid',CHA:'บุคลิก การโน้มน้าว เวทของ Bard/Sorcerer/Warlock'};

// id: [ไทย, English, ability]  (เรียงตามชีทภาษาไทย)
const SK = {
  acrobatics:['กายกรรม','Acrobatics','DEX'], animal:['ควบคุมสัตว์','Animal Handling','WIS'],
  arcana:['เวทมนตร์','Arcana','INT'], athletics:['กรีฑา','Athletics','STR'],
  deception:['หลอกลวง','Deception','CHA'], history:['ประวัติศาสตร์','History','INT'],
  insight:['หยั่งรู้ใจคน','Insight','WIS'], intimidation:['ข่มขู่','Intimidation','CHA'],
  investigation:['สืบสวน','Investigation','INT'], medicine:['การแพทย์','Medicine','WIS'],
  nature:['ธรรมชาติ','Nature','INT'], perception:['การรับรู้','Perception','WIS'],
  performance:['การแสดง','Performance','CHA'], persuasion:['โน้มน้าว','Persuasion','CHA'],
  religion:['ศาสนา','Religion','INT'], sleight:['ฝีมือล้วงกระเป๋า','Sleight of Hand','DEX'],
  stealth:['ย่องเงียบ','Stealth','DEX'], survival:['เอาชีวิตรอด','Survival','WIS']
};
const SK_IDS = Object.keys(SK);

// ----- อาวุธ: id:[en, th, cat, melee/ranged, dice, dmgType, flags]
// flags: f finesse, t thrown, v versatile(dice), 2 two-handed, h heavy, l light, r reach, a ammo, d loading
const DT = {s:'ฟัน',p:'แทง',b:'กระแทก'};
const W = {
  club:['Club','ไม้กระบอง','simple','m','1d4','b','l'],
  dagger:['Dagger','มีดสั้น','simple','m','1d4','p','ftl'],
  greatclub:['Greatclub','กระบองใหญ่','simple','m','1d8','b','2'],
  handaxe:['Handaxe','ขวานมือ','simple','m','1d6','s','tl'],
  javelin:['Javelin','หอกซัด','simple','m','1d6','p','t'],
  lighthammer:['Light hammer','ค้อนเบา','simple','m','1d4','b','tl'],
  mace:['Mace','กระบองหนาม (เมซ)','simple','m','1d6','b',''],
  quarterstaff:['Quarterstaff','ไม้เท้ายาว','simple','m','1d6','b','v1d8'],
  sickle:['Sickle','เคียว','simple','m','1d4','s','l'],
  spear:['Spear','หอก','simple','m','1d6','p','tv1d8'],
  lightcrossbow:['Light crossbow','หน้าไม้เบา','simple','r','1d8','p','ad2'],
  dart:['Dart','ลูกดอก','simple','r','1d4','p','ft'],
  shortbow:['Shortbow','ธนูสั้น','simple','r','1d6','p','a'],
  sling:['Sling','หนังสติ๊ก','simple','r','1d4','b','a'],
  battleaxe:['Battleaxe','ขวานรบ','martial','m','1d8','s','v1d10'],
  flail:['Flail','ลูกตุ้มโซ่','martial','m','1d8','b',''],
  glaive:['Glaive','ง้าว','martial','m','1d10','s','2hr'],
  greataxe:['Greataxe','ขวานใหญ่','martial','m','1d12','s','2h'],
  greatsword:['Greatsword','ดาบใหญ่สองมือ','martial','m','2d6','s','2h'],
  halberd:['Halberd','ทวนขวาน','martial','m','1d10','s','2hr'],
  longsword:['Longsword','ดาบยาว','martial','m','1d8','s','v1d10'],
  maul:['Maul','ค้อนยักษ์','martial','m','2d6','b','2h'],
  morningstar:['Morningstar','ลูกตุ้มหนาม','martial','m','1d8','p',''],
  pike:['Pike','หอกยาว','martial','m','1d10','p','2hr'],
  rapier:['Rapier','ดาบเรเพียร์','martial','m','1d8','p','f'],
  scimitar:['Scimitar','ดาบโค้ง','martial','m','1d6','s','fl'],
  shortsword:['Shortsword','ดาบสั้น','martial','m','1d6','p','fl'],
  trident:['Trident','ตรีศูล','martial','m','1d6','p','tv1d8'],
  warpick:['War pick','ขวานจิก','martial','m','1d8','p',''],
  warhammer:['Warhammer','ค้อนศึก','martial','m','1d8','b','v1d10'],
  whip:['Whip','แส้','martial','m','1d4','s','fr'],
  handcrossbow:['Hand crossbow','หน้าไม้มือ','martial','r','1d6','p','adl'],
  heavycrossbow:['Heavy crossbow','หน้าไม้หนัก','martial','r','1d10','p','ad2h'],
  longbow:['Longbow','ธนูยาว','martial','r','1d8','p','a2h']
};
// "2" ในธง = two-handed ; ตัวเลข "d2" ใน lightcrossbow แปลว่า loading+two-handed — แยกด้วยฟังก์ชัน wf()
function wf(id){
  const f = W[id][6]; const o = {f:0,t:0,v:null,two:0,h:0,l:0,r:0,a:0,ld:0};
  const m = f.match(/v(\d+d\d+)/); if(m){o.v=m[1];}
  const g = f.replace(/v\d+d\d+/,'');
  o.f=g.includes('f'); o.t=g.includes('t'); o.two=g.includes('2'); o.h=g.includes('h');
  o.l=g.includes('l'); o.r=g.includes('r'); o.a=g.includes('a'); o.ld=g.includes('d');
  return o;
}
const SIMPLE_MELEE = Object.keys(W).filter(k=>W[k][2]==='simple'&&W[k][3]==='m');
const SIMPLE_ALL = Object.keys(W).filter(k=>W[k][2]==='simple');
const MARTIAL_MELEE = Object.keys(W).filter(k=>W[k][2]==='martial'&&W[k][3]==='m');
const MARTIAL_ALL = Object.keys(W).filter(k=>W[k][2]==='martial');
const PICKS = {
  simple:{label:'อาวุธ Simple อะไรก็ได้',list:SIMPLE_ALL},
  simplemelee:{label:'อาวุธ Simple ระยะประชิดอะไรก็ได้',list:SIMPLE_MELEE},
  martial:{label:'อาวุธ Martial อะไรก็ได้',list:MARTIAL_ALL},
  martialmelee:{label:'อาวุธ Martial ระยะประชิดอะไรก็ได้',list:MARTIAL_MELEE}
};

// ----- เกราะ: id:[en, th, type, baseAC, dexCap(null=ไม่จำกัด,0=ไม่บวก), strReq, stealthDis]
const ARMOR = {
  padded:['Padded','เกราะบุนวม','light',11,null,0,1],
  leather:['Leather armor','เกราะหนัง','light',11,null,0,0],
  studded:['Studded leather','เกราะหนังหมุด','light',12,null,0,0],
  hide:['Hide','เกราะหนังสัตว์','medium',12,2,0,0],
  chainshirt:['Chain shirt','เสื้อเกราะโซ่','medium',13,2,0,0],
  scale:['Scale mail','เกราะเกล็ด','medium',14,2,0,1],
  breastplate:['Breastplate','เกราะอก','medium',14,2,0,0],
  halfplate:['Half plate','เกราะครึ่งตัว','medium',15,2,0,1],
  ring:['Ring mail','เกราะห่วง','heavy',14,0,0,1],
  chain:['Chain mail','เกราะโซ่','heavy',16,0,13,1],
  splint:['Splint','เกราะแผ่นเหล็กซี่','heavy',17,0,15,1],
  plate:['Plate','เกราะเหล็กเต็มตัว','heavy',18,0,15,1],
  shield:['Shield','โล่','shield',2,0,0,0]
};

// ----- แพ็กอุปกรณ์
const PACKS = {
  burglar:['Burglar\'s Pack','แพ็กหัวขโมย','กระเป๋าเป้, ลูกปืนเหล็ก 1,000 เม็ด, เชือกเล็ก 10 ฟุต, กระดิ่ง, เทียน 5 เล่ม, ชะแลง, ค้อน, หมุดปีน 10 อัน, ตะเกียงมีฝา, น้ำมัน 2 ขวด, เสบียง 5 วัน, กล่องจุดไฟ, ถุงน้ำ, เชือกป่าน 50 ฟุต'],
  dungeoneer:['Dungeoneer\'s Pack','แพ็กนักสำรวจดันเจี้ยน','กระเป๋าเป้, ชะแลง, ค้อน, หมุดปีน 10 อัน, คบเพลิง 10 อัน, กล่องจุดไฟ, เสบียง 10 วัน, ถุงน้ำ, เชือกป่าน 50 ฟุต'],
  explorer:['Explorer\'s Pack','แพ็กนักผจญภัย','กระเป๋าเป้, ผ้านอน, ชุดเครื่องครัวพกพา, กล่องจุดไฟ, คบเพลิง 10 อัน, เสบียง 10 วัน, ถุงน้ำ, เชือกป่าน 50 ฟุต'],
  priest:['Priest\'s Pack','แพ็กนักบวช','กระเป๋าเป้, ผ้าห่ม, เทียน 10 เล่ม, กล่องจุดไฟ, กล่องรับบริจาค, ธูป 2 ก้อน, กระถางธูป, ชุดนักบวช, เสบียง 2 วัน, ถุงน้ำ'],
  scholar:['Scholar\'s Pack','แพ็กนักวิชาการ','กระเป๋าเป้, หนังสือความรู้, หมึก 1 ขวด, ปากกา, กระดาษหนัง 10 แผ่น, ถุงทรายเล็ก, มีดเล็ก'],
  diplomat:['Diplomat\'s Pack','แพ็กนักการทูต','หีบ, กล่องใส่แผนที่/ม้วนกระดาษ 2 อัน, เสื้อผ้าดี, หมึก 1 ขวด, ปากกา, ตะเกียง, น้ำมัน 2 ขวด, กระดาษ 5 แผ่น, น้ำหอม 1 ขวด, ขี้ผึ้งปิดผนึก, สบู่'],
  entertainer:['Entertainer\'s Pack','แพ็กนักแสดง','กระเป๋าเป้, ผ้านอน, เครื่องแต่งกายแสดง 2 ชุด, เทียน 5 เล่ม, เสบียง 5 วัน, ถุงน้ำ, ชุดปลอมตัว']
};

// ----- รายการเครื่องมือ

// ---------- ข้อมูลที่ประกอบจากตัวเลือก ----------
function raceInfo(S) {
  const r = RACES[S.race]; if (!r) return null;
  const sub = (r.subs && r.subs[S.sub]) || null;
  const asi = Object.assign({}, r.asi);
  if (sub && sub.asi) for (const k in sub.asi) asi[k] = (asi[k] || 0) + sub.asi[k];
  if (r.halfElfPlus) for (const a of S.hePlus) asi[a] = (asi[a] || 0) + 1;
  return {
    r, sub, asi, spd: (sub && sub.spd) || r.spd, lang: r.lang.slice(),
    extraLang: (r.extraLang || 0) + ((sub && sub.extraLang) || 0),
    wp: (r.wp || []).concat((sub && sub.wp) || []),
    armorP: (sub && sub.armorP) || [], hp: (sub && sub.hp) || 0,
    skills: (r.skills || []).slice(), skillPick: r.skillPick || 0,
    name: r.n + (sub ? ' (' + sub.n.split(' (')[0] + ')' : ''),
    needSub: !!r.subs
  };
}
const clsOf = S => CLASSES[S.cls] || null;
const bgOf = S => BGS[S.bg] || null;
const domOf = S => (S.cls === 'cleric' && DOMAINS[S.domain]) || null;
const orgOf = S => (S.cls === 'sorcerer' && ORIGINS[S.origin]) || null;

function profArmor(S) {
  const c = clsOf(S), ri = raceInfo(S), d = domOf(S);
  let a = (c ? c.armorP : []).concat(ri ? ri.armorP : []);
  if (d && d.heavy) a = a.concat(['heavy']);
  return a;
}
function isWeaponProf(S, id) {
  const c = clsOf(S), ri = raceInfo(S), d = domOf(S);
  const cat = W[id][2];
  if (c && (c.wp.includes(cat) || c.wp.includes(id))) return true;
  if (ri && ri.wp.includes(id)) return true;
  if (d && d.martial && cat === 'martial') return true;
  return false;
}

// กลุ่มทักษะที่ต้องเลือก
function skillGroups(S) {
  const g = [], c = clsOf(S), ri = raceInfo(S), d = domOf(S);
  if (c) g.push({key:'class', label:'อาชีพ ' + c.n + ': เลือก ' + c.nSk + ' ทักษะ', n:c.nSk, list:c.skills || SK_IDS});
  if (ri && ri.skillPick) g.push({key:'race', label:'ฮาล์ฟเอลฟ์: เลือก ' + ri.skillPick + ' ทักษะอะไรก็ได้', n:ri.skillPick, list:SK_IDS});
  if (d && d.skillPick) g.push({key:'domain', label:'สายเทพ ' + d.n.split(' (')[0] + ': เลือก ' + d.skillPick.n + ' ทักษะ' + (d.skillPick.expertise ? ' (ได้ x2 โบนัสชำนาญ)' : ''), n:d.skillPick.n, list:d.skillPick.list});
  return g;
}
function fixedSkills(S) {
  const b = bgOf(S), ri = raceInfo(S);
  return (b ? b.skills : []).concat(ri ? ri.skills : []);
}
function fixedSkillSource(S, id) {
  const b = bgOf(S), ri = raceInfo(S);
  if (b && b.skills.includes(id)) return 'ภูมิหลัง';
  if (ri && ri.skills.includes(id)) return 'เผ่าพันธุ์';

      const dr = DRAGONS[S.dragon], dc = 8 + mod(scv.CON) + 2;
      lines.push('Breath Weapon (' + dr[0].split(' (')[0] + '): พ่น ' + dr[2] + ' ดาเมจ' + dr[1].split(' (')[0] + ' 2d6 (ผู้ถูกพ่นทอยป้องกัน ' + dr[3] + ' DC ' + dc + ' ได้ดาเมจครึ่งเดียวถ้าผ่าน) ใช้ได้ 1 ครั้ง/พักสั้นหรือยาว');
      lines.push('Damage Resistance: ต้านทานดาเมจ' + dr[1].split(' (')[0]);
    }
    F('เผ่าพันธุ์ ' + ri.name, lines);
  }
  if (c) {
    const lines = c.feats.slice();
    if (d) lines.push('Domain ' + d.n + ': ' + d.note);
    if (o) lines.push('Origin ' + o.n + ': ' + o.note);
    if (S.patron) lines.push('Patron ' + PATRONS[S.patron].n);
    if (S.style) lines.push('Fighting Style ' + STYLES[S.style].n + ': ' + STYLES[S.style].note);
    F('อาชีพ ' + c.n, lines);
  }
  if (b) F('ภูมิหลัง ' + b.n, [b.feature]);
  R.className2 = c ? c.n : '';
  // ---- equipment
  R.equipment = [];
  eq.weapons.forEach(w => R.equipment.push(W[w.id][0] + (w.q > 1 ? ' x' + w.q : '') + ' (' + W[w.id][1] + ')'));
  eq.armor.forEach(a => R.equipment.push(a.label || (ARMOR[a.id][0] + ' (' + ARMOR[a.id][1] + ')')));
  eq.packs.forEach(p => R.equipment.push(PACKS[p][0] + ' (' + PACKS[p][1] + ')'));
  eq.texts.forEach(t => R.equipment.push(t.t + (t.q > 1 ? ' x' + t.q : '')));
  if (b) { b.items.forEach(i => R.equipment.push(i)); R.equipment.push(b.gp + ' gp (ถุงเงิน)'); }
  R.packs = eq.packs.map(p => ({name:PACKS[p][0], th:PACKS[p][1], contents:PACKS[p][2]}));
  R.gp = b ? b.gp : 0;
  R.complete = R.missing.length === 0;
  return R;
}
// ===== UI (browser) =====
const STEPS = [{id:'race',t:'1 เผ่าพันธุ์'},{id:'class',t:'2 อาชีพ'},{id:'bg',t:'3 ภูมิหลัง'},{id:'abil',t:'4 ค่าความสามารถ'},{id:'skill',t:'5 ทักษะ/ภาษา'},{id:'equip',t:'6 อุปกรณ์'},{id:'info',t:'7 ชื่อ/ศีลธรรม'},{id:'result',t:'ผลลัพธ์ ✦'}];
let S = newState();
const UI = {why:true, checks:{}, copied:'', loaded:false};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asiTxt = a => Object.keys(a).map(k => k + ' ' + sg(a[k])).join(', ');
const skName = id => SK[id][0] + ' (' + SK[id][1] + ')';
const itemLabel = (it, S2) => {
  if (it.w) return W[it.w][0] + (it.q > 1 ? ' x' + it.q : '') + ' · ' + W[it.w][1];
  if (it.a) return it.label || (ARMOR[it.a][0] + ' · ' + ARMOR[it.a][1]);
  if (it.pack) return PACKS[it.pack][0] + ' · ' + PACKS[it.pack][1];
  if (it.pick) return PICKS[it.pick].label + (it.q > 1 ? ' x' + it.q : '');
  return it.t + (it.q > 1 ? ' x' + it.q : '');
};

function save() { try { localStorage.setItem('dnd-builder-v1', JSON.stringify(S)); } catch (e) {} try { if (window.hot && hot.snapshot) hot.snapshot(S); } catch (e) {} }
function load() {
  try { const j = localStorage.getItem('dnd-builder-v1'); if (j) { S = Object.assign(newState(), JSON.parse(j)); sanitize(S); } } catch (e) {}
}

function stepStatus(id, R) {
  const m = R.missing.filter(x => x.step === id).length;
  const pre = {race:S.race, class:S.cls, bg:S.bg, skill:S.cls && S.bg && S.race, equip:S.cls, abil:true, info:S.name.trim() || S.align, result:true}[id];
  if (id === 'result') return R.complete ? 'done' : '';
  if (!pre) return '';
  return m ? 'warn' : 'done';
}

function chipsHtml() {
  const R = compute(S);
  return STEPS.map((s, i) => '<button class="chip ' + (i === S.step ? 'on ' : '') + stepStatus(s.id, R) + '" data-a="go" data-v="' + i + '"><span class="dot"></span>' + s.t + '</button>').join('');
}

// ---------- step: class ----------

// ---------- step: abilities ----------

  if (S.method === 'roll') {
    h += '<div class="row" style="margin:10px 0"><button class="btn" data-a="roll">🎲 ' + (S.pool.length ? 'ทอยใหม่ทั้งหมด' : 'ทอย 6 ครั้ง') + '</button>' + (S.pool.length ? '<span>ผลที่ได้: <b>' + S.pool.slice().sort((a, b) => b - a).join(', ') + '</b></span>' : '') + '</div>';

  const pool = poolValues(S), base = baseScores(S), fin = finalScores(S);

// ---------- step: skills / languages / tools ----------
function stepSkill() {
  if (!S.race || !S.cls || !S.bg) return '<div class="card"><h2>ทักษะ ภาษา เครื่องมือ</h2><div class="note">ต้องเลือกเผ่าพันธุ์ อาชีพ และภูมิหลังให้ครบก่อน (ขั้นที่ 1-3) เพราะทั้งสามอย่างให้ทักษะ</div></div>';

  h += '<h3>ที่ได้อัตโนมัติ</h3><div class="skills">' + fixed.map(id => '<div class="sk fix"><span>' + skName(id) + '</span><small>' + fixedSkillSource(S, id) + '</small></div>').join('') + '</div>';
  groups.forEach(g => {
    const sel = S.sk[g.key] || [];
    h += '<h3>' + esc(g.label) + ' <span class="tag">' + sel.length + '/' + g.n + '</span></h3><div class="skills">';
    g.list.forEach(id => {
      const on = sel.includes(id), other = !on && taken.includes(id), full = !on && sel.length >= g.n;
      h += '<button class="sk ' + (on ? 'sel' : '') + '" data-a="skill" data-k="' + g.key + '" data-v="' + id + '"' + ((other || full) ? ' disabled' : '') + '><span>' + skName(id) + '</span><small>' + SK[id][2] + (other ? ' · ซ้ำ' : '') + '</small></button>';
    });
    h += '</div>';
  });
  const c = clsOf(S);
  if (c && c.expertise) {
    const prof = allSkillProf(S);
    h += '<h3>Expertise: เลือก ' + c.expertise + ' ทักษะที่จะได้ x2 โบนัสชำนาญ <span class="tag">' + S.exp.length + '/' + c.expertise + '</span></h3><div class="skills">';
    prof.forEach(id => { const on = S.exp.includes(id); h += '<button class="sk ' + (on ? 'sel' : '') + '" data-a="exp" data-v="' + id + '"' + ((!on && S.exp.length >= c.expertise) ? ' disabled' : '') + '><span>' + skName(id) + '</span><small>+4</small></button>'; });
    h += '</div>';
    if (prof.length < 1) h += '<div class="note">เลือกทักษะด้านบนก่อน</div>';
  }
  h += '</div>';
  const tn = toolNeeds(S);
  const fixedT = (bgOf(S).tools || []).concat(c.fixedTools || []);
  h += '<div class="card"><h2>เครื่องมือ (Tools)</h2>';
  h += fixedT.length ? '<p class="lead">ได้อัตโนมัติ: <b>' + fixedT.join(', ') + '</b></p>' : '<p class="lead">ไม่มีเครื่องมือติดตัวอัตโนมัติ</p>';
  tn.forEach(t => {
    h += '<label class="f">' + esc(t.label) + '</label><select data-a="tool" data-k="' + t.key + '"><option value="">— เลือก —</option>' + t.list.map(x => '<option' + (S.tool[t.key] === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>';
  });
  h += '</div>';
  const fl = fixedLangs(S), need = langNeed(S);
  h += '<div class="card"><h2>ภาษา (Languages)</h2><p class="lead">ได้อัตโนมัติ: <b>' + fl.join(', ') + '</b></p>';
  if (need) {
    h += '<h3>เลือกภาษาเพิ่ม <span class="tag">' + S.lang.length + '/' + need + '</span></h3><div class="skills">';
    LANGS.filter(l => !fl.includes(l)).forEach(l => {
      const on = S.lang.includes(l);
      h += '<button class="sk ' + (on ? 'sel' : '') + '" data-a="lang" data-v="' + esc(l) + '"' + ((!on && S.lang.length >= need) ? ' disabled' : '') + '><span>' + l + '</span><small>' + (LANG_TH[l] || '') + '</small></button>';
    });
    h += '</div><p class="lead" style="margin-top:8px">ถามกับ GM ว่าภาษาลับหรือแปลกๆ (เช่น Abyssal, Deep Speech) ใช้ได้ในแคมเปญไหม</p>';
  } else h += '<p class="lead">ไม่มีภาษาให้เลือกเพิ่ม</p>';
  return h + '</div>';
}

  c.equip.forEach((g, gi) => {

function plainText(R) {
  const L = [];

  L.push('HP: ' + R.hp + ' | AC: ' + R.ac + ' (' + R.armorName + ') | ความเร็ว: ' + R.speed + ' ฟุต | อินนิเชียทีฟ: ' + sg(R.init));
  L.push('ค่าความสามารถ (โบนัส / ค่า / ทอยป้องกัน): ' + R.abilities.map(a => a.ab + ' ' + sg(a.mod) + ' / ' + a.score + ' / ' + sg(a.save)).join(' ; '));
  L.push('การต่อสู้:'); R.weapons.forEach(w => L.push('  - ' + w.name + ': โจมตี ' + sg(w.atk) + ', ดาเมจ ' + w.dmg));
  if (R.spell) L.push('เวท: DC ' + R.spell.dc + ', โจมตี ' + sg(R.spell.atk) + ', cantrip ' + R.spell.cantrips + ', ช่องคาถา ' + R.spell.slots);
  L.push('ทักษะที่ชำนาญ: ' + R.skills.filter(s => s.prof).map(s => s.th + ' ' + sg(s.bonus) + (s.exp ? '*' : '')).join(', '));
  L.push('ทักษะอื่น: ' + R.skills.filter(s => !s.prof).map(s => s.th + ' ' + sg(s.bonus)).join(', '));
  R.features.forEach(f => L.push(f.title + ': ' + f.lines.map(shortFeat).join(' / ')));
  L.push('อุปกรณ์: ' + R.equipment.join(', '));
  L.push('ภาษา: ' + R.languages.join(', ') + (R.tools.length ? ' | เครื่องมือ: ' + R.tools.join(', ') : ''));
  return L.join('\n');
}

function stepHtml() { return [stepRace, stepClass, stepBg, stepAbil, stepSkill, stepEquip, stepInfo, resultHtml][S.step](); }
function nextBlocked() { return false; }
function render(keepScroll) {

    '<nav class="bottom"><div class="in"><button class="btn ghost" data-a="prev"' + (S.step === 0 ? ' disabled' : '') + '>← ย้อนกลับ</button><div class="hint">' + (last ? '' : (m.length ? 'ยังขาด: ' + esc(m[0].msg) : '')) + '</div>' +
    (last ? '<span></span>' : '<button class="btn" data-a="next">' + (S.step === STEPS.length - 2 ? 'ดูผลลัพธ์ →' : 'ถัดไป →') + '</button>') + '</div></nav>';
  if (!keepScroll) window.scrollTo(0, 0);

function refreshChips() { const c = document.getElementById('chips'); if (c) c.innerHTML = chipsHtml(); save(); }

function handle(a, v, k, el) {
  switch (a) {
    case 'go': S.step = +v; return render();
    case 'prev': S.step = Math.max(0, S.step - 1); return render();
    case 'next': S.step = Math.min(STEPS.length - 1, S.step + 1); return render();
    case 'race': S.race = v; S.sub = ''; S.dragon = ''; S.hePlus = []; sanitize(S); return render(true);
    case 'sub': S.sub = v; sanitize(S); return render(true);
    case 'dragon': S.dragon = v; return render(true);
    case 'hePlus': { const i = S.hePlus.indexOf(v); if (i >= 0) S.hePlus.splice(i, 1); else if (S.hePlus.length < 2) S.hePlus.push(v); return render(true); }
    case 'cls': S.cls = v; sanitize(S); S.eq = {}; S.pickw = {}; S.sk = {}; S.exp = []; sanitize(S); return render(true);
    case 'domain': case 'origin': case 'patron': case 'style': S[a] = v; sanitize(S); return render(true);
    case 'bg': S.bg = v; sanitize(S); return render(true);
    case 'method': if (S.method !== v) { S.method = v; S.assign = {}; S.pool = []; S.buy = {STR:8,DEX:8,CON:8,INT:8,WIS:8,CHA:8}; } return render(true);
    case 'roll': S.pool = [1,2,3,4,5,6].map(roll4d6); S.assign = {}; return render(true);
    case 'auto': autoAssign(S); return render(true);
    case 'buy': { const n = S.buy[k] + (+v); if (n >= 8 && n <= 15 && (+v < 0 || buyTotal(S) - POINT_COST[S.buy[k]] + POINT_COST[n] <= 27)) S.buy[k] = n; return render(true); }
    case 'skill': { const arr = S.sk[k] || (S.sk[k] = []); const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); sanitize(S); return render(true); }
    case 'exp': { const i = S.exp.indexOf(v); if (i >= 0) S.exp.splice(i, 1); else S.exp.push(v); sanitize(S); return render(true); }
    case 'lang': { const i = S.lang.indexOf(v); if (i >= 0) S.lang.splice(i, 1); else S.lang.push(v); sanitize(S); return render(true); }
    case 'eq': S.eq[k] = +v; sanitize(S); return render(true);
    case 'chk': UI.checks[v] = !UI.checks[v]; el.classList.toggle('done', !!UI.checks[v]); return;
    case 'why': UI.why = el.checked; return render(true);
    case 'copy': return copyText();
    case 'reset': if (UI.confirmReset) { S = newState(); UI.checks = {}; UI.confirmReset = false; return render(); } UI.confirmReset = true; el.textContent = 'กดอีกครั้งเพื่อยืนยันล้างทั้งหมด'; return;
  }
}
function copyText() {
  const txt = plainText(compute(S));
  const done = ok => { UI.copied = ok ? 'ok' : 'fail'; render(true); };
  try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
}

function boot() {
  load();
  const app = document.getElementById('app');
  app.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    const a = el.dataset.a;
    if (['assign', 'tool', 'pickw', 'align', 'name'].includes(a) || a === 'why') return; // handled by change/input
    e.stopPropagation(); handle(a, el.dataset.v, el.dataset.k, el);
  });
  app.addEventListener('change', e => {
